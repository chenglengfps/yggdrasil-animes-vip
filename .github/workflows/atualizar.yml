name: Automação do Catálogo de Animes

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pyrogram tgcrypto telegraph emoji python-dotenv

    - name: Executar Atualização
      env:
        API_ID: ${{ secrets.API_ID }}
        API_HASH: ${{ secrets.API_HASH }}
        PYROGRAM_SESSION: ${{ secrets.SESSION_STRING || secrets.PYROGRAM_SESSION }}
        TELEGRAPH_TOKEN: ${{ secrets.TELEGRAPH_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python3 atualizar_catalogo.py

    - name: Salvar Memória Atualizada no GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        if [ -f catalogo_memoria.json ]; then
          git add -f catalogo_memoria.json
          git commit -m "Auto-update: catalogo_memoria.json [skip ci]" || exit 0
          git push
        fi
